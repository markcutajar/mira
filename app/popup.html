<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file:; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline'">
<title>Mira</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400&display=swap">
<style>
  /* Mira's pop-up (decision 55), in the page's colours: a card for each session calling for me. */
  :root {
    --void: #0b0d1a; --hull: #151a2e; --hull-edge: #2c3358; --hull-shine: rgba(255, 255, 255, 0.05);
    --ink: #ece8d9; --dim: #9c9dbb; --working: #7bd389; --beacon: #ff8a3d; --turn: #6fb6ff; --failed: #ff6b7a;
    --font-display: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
    --font-body: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif;
  }
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
  body { color: var(--ink); font: 14px/1.45 var(--font-body); }
  #cards { display: grid; gap: 10px; padding: 18px; }
  .card { --c: var(--turn); position: relative; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px 40px 14px 14px; background: var(--hull); border: 2px solid var(--c); box-shadow: 0 0 0 2px var(--void), inset 0 2px 0 var(--hull-shine), 0 12px 32px rgba(0, 0, 0, 0.55); cursor: pointer; animation: arrive 0.18s ease-out; transition: opacity 0.35s, transform 0.35s; }
  .card[data-status="needs-me"] { --c: var(--beacon); }
  .card[data-status="failed"] { --c: var(--failed); }
  .card.leaving { opacity: 0; transform: translateY(-6px); }
  @keyframes arrive { from { opacity: 0; transform: scale(0.96); } }
  img { width: 52px; height: 52px; image-rendering: pixelated; }
  .title, .task, .body { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title { font: 600 16px/1.3 var(--font-display); }
  .task { margin-top: 2px; }
  .body { margin: 1px 0 10px; color: var(--dim); font-size: 13px; }
  .actions { display: flex; gap: 8px; }
  button { padding: 4px 12px; border: 2px solid var(--hull-edge); background: transparent; color: var(--dim); font: 500 13px var(--font-display); cursor: pointer; }
  button:hover { color: var(--ink); border-color: var(--dim); }
  .open { background: var(--working); border-color: var(--working); color: var(--void); }
  .open:hover { color: var(--void); border-color: var(--ink); }
  .close { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; padding: 0; border-color: transparent; font-size: 16px; line-height: 1; }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; transition: none; } }
</style>
</head>
<body>
<div id="cards"></div>
<script>
  // A "done" card fades after this long, unless the pointer is resting on it.
  const FADE_MS = 8000;
  const list = document.getElementById('cards');
  const shown = new Map(); // id → { el, timer }

  function card(c) {
    const el = document.createElement('article');
    el.className = 'card';
    el.innerHTML = '<img src="../hub/web/mirling.png" alt=""><div><p class="title"></p><p class="task"></p><p class="body"></p><div class="actions"><button type="button" class="open" title="Show this session in Mira">Open in Mira</button><button type="button" class="editor" title="Open this conversation in Claude Code, in its VS Code window">Open in VS Code</button></div></div><button type="button" class="close" title="Close, and mark it read" aria-label="Close">×</button>';
    el.addEventListener('click', (e) => {
      const action = e.target.closest('.editor') ? 'editor' : e.target.closest('.close') ? 'dismiss' : 'open';
      window.popup.act(action, c.id);
    });
    el.addEventListener('mouseenter', () => clearTimeout(shown.get(c.id)?.timer));
    el.addEventListener('mouseleave', () => fadeLater(c.id, FADE_MS / 2));
    return el;
  }

  function fadeLater(id, ms) {
    const s = shown.get(id);
    if (!s || s.el.dataset.status !== 'my-turn') return;
    clearTimeout(s.timer);
    s.timer = setTimeout(() => {
      s.el.classList.add('leaving');
      setTimeout(() => window.popup.act('expire', id), 350);
    }, ms);
  }

  window.popup.onCards((cards) => {
    for (const [id, s] of shown) {
      if (cards.some((c) => c.id === id)) continue;
      clearTimeout(s.timer);
      s.el.remove();
      shown.delete(id);
    }
    for (const c of cards) {
      let s = shown.get(c.id);
      const fresh = !s || s.el.dataset.status !== c.status;
      if (!s) shown.set(c.id, (s = { el: card(c), timer: 0 }));
      s.el.dataset.status = c.status;
      s.el.querySelector('.title').textContent = c.title;
      s.el.querySelector('.task').textContent = c.task ?? '';
      s.el.querySelector('.task').hidden = !c.task;
      s.el.querySelector('.body').textContent = c.body;
      list.append(s.el); // in the order sent, newest first
      if (fresh) {
        s.el.classList.remove('leaving');
        clearTimeout(s.timer);
        fadeLater(c.id, FADE_MS);
      }
    }
    report();
  });

  // How tall the cards are, so the window fits them; again whenever that changes, as when the fonts arrive.
  const report = () => window.popup.size(shown.size ? list.getBoundingClientRect().height : 0);
  new ResizeObserver(report).observe(list);
</script>
</body>
</html>
