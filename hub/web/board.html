<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
  /* Status board (build plan step 3): plain on purpose, to live with the real data before the sky. */
  :root {
    color-scheme: dark;
    --void: #0b0d1a;
    --hull: #151a2e;
    --hull-edge: #2c3358;
    --hull-shine: rgba(255, 255, 255, 0.05);
    --ink: #ece8d9;
    --dim: #9c9dbb;
    --faint: #6b6e8f;
    --thronglet: #ffd34d;
    --beacon: #ff8a3d;
    --beacon-wash: rgba(255, 138, 61, 0.08);
    --working: #7bd389;
    --turn: #6fb6ff;
    --failed: #ff6b7a;
    --ended: #6b6e8f;
    --font-display: "Pixelify Sans", ui-monospace, "Cascadia Mono", monospace;
    --font-body: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--void); color: var(--ink); font: 14px/1.45 var(--font-body); }
  button { font: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--thronglet); outline-offset: 2px; }

  .top { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 20px; background: var(--hull); border-bottom: 2px solid var(--hull-edge); }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
  .wordmark { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: 0.08em; color: var(--thronglet); }
  .sub { font-family: var(--font-display); font-size: 14px; color: var(--dim); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border: 2px solid var(--hull-edge); font-family: var(--font-display); font-size: 13px; }
  .chip i { width: 8px; height: 8px; background: var(--c); }
  .chip b { font-family: var(--font-data); font-weight: 500; font-variant-numeric: tabular-nums; }
  .chip.on { border-color: var(--beacon); }
  .hold { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--dim); cursor: pointer; }
  .hold input { accent-color: var(--thronglet); }
  .conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
  .conn::before { content: ""; width: 8px; height: 8px; background: var(--working); }
  .conn[data-state="down"]::before { background: var(--failed); }

  [data-status="working"] { --c: var(--working); }
  [data-status="needs-me"] { --c: var(--beacon); }
  [data-status="my-turn"] { --c: var(--turn); }
  [data-status="failed"] { --c: var(--failed); }
  [data-status="ended"], [data-status="unknown"] { --c: var(--ended); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; max-width: 1600px; margin: 0 auto; padding: 16px 20px 32px; }
  .main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .box { background: var(--hull); border: 2px solid var(--hull-edge); box-shadow: inset 0 2px 0 var(--hull-shine); }
  .eyebrow { margin: 0 0 8px; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }

  #prompts { display: flex; flex-direction: column; gap: 10px; }
  .prompt { padding: 12px 14px; border-color: var(--beacon); background: linear-gradient(var(--beacon-wash), var(--beacon-wash)), var(--hull); }
  .prompt-head { display: flex; align-items: center; gap: 10px; }
  .where { font-family: var(--font-display); font-size: 14px; }
  .countdown { margin-left: auto; font-family: var(--font-data); font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .prompt-title { margin: 8px 0; font-size: 15px; }
  .cmd { margin: 0 0 10px; padding: 8px 10px; background: var(--void); font: 12px/1.5 var(--font-data); white-space: pre-wrap; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .bar { height: 3px; margin-top: 10px; background: var(--void); }
  .bar i { display: block; height: 100%; width: 100%; background: var(--beacon); }
  .hint { margin: 0; font-size: 12px; color: var(--dim); }

  .go, .stop, .ghost { padding: 6px 14px; border: 2px solid transparent; cursor: pointer; font-family: var(--font-display); font-size: 14px; }
  .go { background: var(--working); color: var(--void); }
  .stop { background: transparent; color: var(--failed); border-color: var(--failed); }
  .ghost { background: transparent; color: var(--dim); border-color: var(--hull-edge); }
  .ghost.small, .go.small { padding: 3px 9px; font-size: 12px; }
  a.go, a.ghost { display: inline-block; text-decoration: none; }
  button:disabled { opacity: 0.5; cursor: default; }

  #sections { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 16px; align-items: start; }
  .project { padding: 12px 14px 4px; }
  .project > header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-bottom: 8px; }
  .project h2 { margin: 0; font: 600 18px var(--font-display); overflow-wrap: anywhere; }
  .summary { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .needs { color: var(--beacon); font-weight: 500; }
  .session { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--hull-edge); }
  .pill { justify-self: start; padding: 2px 8px; background: var(--c); color: var(--void); font-family: var(--font-display); font-size: 12px; white-space: nowrap; }
  .title { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
  .mode { margin-left: 8px; padding: 0 6px; border: 1px solid var(--hull-edge); font: 11px var(--font-data); color: var(--dim); vertical-align: 2px; }
  .mode[data-mode="bypassPermissions"] { border-color: var(--failed); color: var(--failed); }
  .mode.tree { border-color: var(--turn); color: var(--turn); }
  .meta { margin-top: 2px; font: 12px var(--font-data); color: var(--dim); overflow-wrap: anywhere; }
  .faint { color: var(--faint); }
  .helpers { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .helper { padding: 1px 6px; border: 1px solid var(--working); color: var(--working); font: 11px var(--font-data); }
  .empty { padding: 16px; }
  .empty p { margin: 6px 0 0; color: var(--dim); max-width: 60ch; }

  .stream { padding: 12px 14px; align-self: start; position: sticky; top: 72px; max-height: calc(100vh - 92px); overflow: auto; }
  #events { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font: 12px var(--font-data); }
  #events li { display: grid; grid-template-columns: 8ch minmax(0, 1fr); column-gap: 10px; }
  #events .t { color: var(--faint); }
  #events .line { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #events .type { color: var(--thronglet); }
  #events .what { color: var(--dim); }

  .title-btn { all: unset; cursor: pointer; overflow-wrap: anywhere; }
  .title-btn:hover, .session.open .title-btn { color: var(--thronglet); }
  .title-btn:focus-visible, .turn-head:focus-visible { outline: 2px solid var(--thronglet); outline-offset: 2px; }

  /* The story panel: one session, turn by turn, read from its transcript when opened. */
  .panel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 3; width: min(760px, 100%); display: flex; flex-direction: column; background: var(--hull); border-left: 2px solid var(--hull-edge); box-shadow: -12px 0 32px rgba(0, 0, 0, 0.45); }
  .panel-head { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px 10px; border-bottom: 1px solid var(--hull-edge); }
  .panel-head > div:first-child { flex: 1; min-width: 0; }
  .panel-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  .panel-head h2 { margin: 4px 0 2px; font: 600 18px var(--font-display); overflow-wrap: anywhere; }
  .totals { display: flex; flex-wrap: wrap; gap: 8px 22px; padding: 10px 18px; border-bottom: 1px solid var(--hull-edge); font: 11px var(--font-data); color: var(--dim); }
  .totals b { display: block; font: 500 16px var(--font-data); color: var(--ink); font-variant-numeric: tabular-nums; }
  .totals .cost b { color: var(--thronglet); }
  .totals .hint { flex-basis: 100%; }
  .turns { flex: 1; overflow: auto; padding: 4px 18px 28px; }
  .earlier { margin: 10px 0; }
  .turn { border-top: 1px solid var(--hull-edge); }
  .turn-head { all: unset; box-sizing: border-box; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: baseline; width: 100%; padding: 9px 0; cursor: pointer; }
  .turn-head .t { font: 12px var(--font-data); color: var(--faint); white-space: nowrap; }
  .turn-prompt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .turn[data-from="agent"] .turn-prompt { color: var(--dim); font-style: italic; }
  .turn-meta { font: 12px var(--font-data); color: var(--dim); white-space: nowrap; }
  .state { margin-right: 8px; padding: 0 6px; background: var(--c); color: var(--void); font-family: var(--font-display); }
  .state[data-state="running"] { --c: var(--working); }
  .state[data-state="interrupted"], .state[data-state="quiet"] { --c: var(--dim); }
  .state[data-state="failed"] { --c: var(--failed); }
  .turn-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin: 0 0 14px 4px; padding-left: 12px; border-left: 2px solid var(--hull-edge); }
  .you, .reply { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; line-height: 1.55; }
  .you { padding: 8px 10px; border-left: 3px solid var(--thronglet); background: var(--void); }
  /* Replies rendered from Markdown by markdown.js. */
  .md { white-space: normal; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md blockquote, .md pre, .md .md-table, .md hr { margin: 0 0 8px; }
  .md ul, .md ol { padding-left: 22px; }
  .md li + li { margin-top: 3px; }
  .md li > ul, .md li > ol { margin: 3px 0 0; }
  .md .md-h { margin: 14px 0 6px; font: 600 14px var(--font-body); color: var(--ink); }
  .md h3.md-h { font-size: 16px; }
  .md h4.md-h { font-size: 15px; }
  .md strong { font-weight: 600; }
  .md code { padding: 1px 5px; background: var(--void); font: 12px var(--font-data); }
  .md pre { padding: 8px 10px; background: var(--void); overflow-x: auto; font: 12px/1.5 var(--font-data); white-space: pre; }
  .md pre code { padding: 0; background: none; }
  .md blockquote { padding-left: 10px; border-left: 3px solid var(--hull-edge); color: var(--dim); }
  .md .md-table { overflow-x: auto; }
  .md table { border-collapse: collapse; font-size: 12.5px; }
  .md th, .md td { padding: 4px 8px; border: 1px solid var(--hull-edge); text-align: left; vertical-align: top; }
  .md th { background: var(--void); font-weight: 600; }
  .md .md-right { text-align: right; }
  .md .md-center { text-align: center; }
  .md a, .md .md-ref { color: var(--turn); }
  .md .md-ref { font: 12px var(--font-data); cursor: help; }
  .md hr { border: 0; border-top: 1px solid var(--hull-edge); }
  .tool { display: flex; gap: 8px; align-items: baseline; font: 12px var(--font-data); color: var(--dim); }
  .tool-name { flex: none; color: var(--working); }
  .tool.failed .tool-name, .failed-tag { color: var(--failed); }
  .tool-sum { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .helper-card { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-left: 16px; padding: 6px 10px; border: 1px solid var(--hull-edge); font: 12px var(--font-data); color: var(--dim); }
  .note { margin: 0; font: 11px var(--font-data); color: var(--faint); letter-spacing: 0.06em; text-transform: uppercase; }
  .panel-msg { padding: 18px 0; color: var(--dim); }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: min(640px, calc(100% - 32px)); padding: 10px 14px; background: var(--hull); border: 2px solid var(--hull-edge); font-size: 13px; overflow-wrap: anywhere; user-select: all; }

  @media (max-width: 960px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .stream { position: static; max-height: none; }
    .panel-head, .totals, .turns { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="wordmark">MIRA</span><span class="sub">Status board</span></div>
  <div class="chips" aria-label="Sessions by status">
    <span class="chip" data-status="working"><i></i>Working <b id="n-working">0</b></span>
    <span class="chip" data-status="needs-me" id="chip-needs"><i></i>Needs you <b id="n-needs-me">0</b></span>
    <span class="chip" data-status="my-turn"><i></i>Your turn <b id="n-my-turn">0</b></span>
    <span class="chip" data-status="failed"><i></i>Failed <b id="n-failed">0</b></span>
  </div>
  <label class="hold" title="While this tab is open and on screen, permission prompts wait here before the terminal asks."><input type="checkbox" id="hold"> Answer prompts here</label>
  <span class="conn" id="conn" data-state="down" role="status">Connecting…</span>
</header>

<main class="layout">
  <div class="main">
    <section id="prompts" aria-label="Waiting for you" hidden></section>
    <div id="sections"></div>
  </div>
  <aside class="stream box" aria-label="Event stream">
    <h2 class="eyebrow">Event stream</h2>
    <ol id="events"></ol>
  </aside>
</main>
<aside class="panel" id="panel" aria-labelledby="panel-title" hidden>
  <header class="panel-head">
    <div>
      <button type="button" class="ghost small" id="panel-back" hidden>← Back to session</button>
      <h2 id="panel-title"></h2>
      <div class="meta" id="panel-sub"></div>
    </div>
    <div class="panel-actions">
      <a class="go small" id="panel-editor" hidden>Continue in VS Code</a>
      <button type="button" class="ghost small" id="panel-close" aria-label="Close the story">Close</button>
    </div>
  </header>
  <div class="totals" id="panel-totals"></div>
  <div class="turns" id="panel-turns"></div>
</aside>
<p class="toast" id="toast" role="status" hidden></p>

<script src="/markdown.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const LABEL = { 'needs-me': 'Needs you', failed: 'Failed', 'my-turn': 'Your turn', working: 'Working', ended: 'Ended' };
  const ORDER = ['needs-me', 'failed', 'my-turn', 'working', 'ended', null];
  const STATE = { running: 'Running', quiet: 'Quiet', interrupted: 'Interrupted', failed: 'Failed' };
  const TURNS_STEP = 30;
  // A turn or subagent that stopped writing this long ago was cut off, not still at work.
  const QUIET_MS = 30 * 60 * 1000;
  const quiet = (iso) => Boolean(iso) && Date.now() - Date.parse(iso) > QUIET_MS;
  const state = { sessions: [], pending: [], events: [], viewer: null, waitSeconds: 60, connected: false, busy: new Set() };
  // The open story: which session (and subagent), how many turns, and which turns are unfolded.
  const panel = { id: null, helper: null, helperName: '', turns: TURNS_STEP, story: null, error: '', open: new Set(), auto: null, timer: 0, editor: null };
  let lastSessionsHTML = '';
  let toastTimer = 0;

  let hold = true;
  try { hold = localStorage.getItem('mira.answerHere') !== 'off'; } catch { /* storage unavailable: default on */ }
  $('hold').checked = hold;

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const folder = (p) => (p ? p.split(/[\\/]/).filter(Boolean).pop() : '');
  const short = (id) => String(id).slice(0, 8);
  const label = (s) => s.title || `${folder(s.cwd) || s.system} · ${short(s.id)}`;
  const rank = (s) => ORDER.indexOf(s?.status ?? null);
  const clock = (iso) => new Date(iso).toTimeString().slice(0, 8);
  const watching = () => hold && document.visibilityState === 'visible';
  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  function tokens(n) {
    if (n >= 1e6) return `${(n / 1e6).toFixed(1)}M`;
    return n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(n);
  }
  function cost(usd) {
    if (usd < 0.005) return '<$0.01';
    return usd >= 1000 ? `$${Math.round(usd).toLocaleString()}` : `$${usd.toFixed(2)}`;
  }
  function when(iso) {
    const d = new Date(iso);
    const time = d.toTimeString().slice(0, 5);
    return d.toDateString() === new Date().toDateString() ? time : `${d.getDate()} ${d.toLocaleString('en', { month: 'short' })} ${time}`;
  }
  function ago(iso) {
    const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
    if (s < 10) return 'just now';
    if (s < 60) return `${s}s ago`;
    const m = Math.round(s / 60);
    return m < 60 ? `${m}m ago` : `${Math.round(m / 60)}h ago`;
  }

  function toast(text) {
    const el = $('toast');
    el.textContent = text;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 6000);
  }

  // -- live connection --
  function presence() {
    if (!state.viewer) return;
    fetch('/api/presence', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ viewer: state.viewer, visible: watching() }) }).catch(() => {});
  }

  function connect() {
    const stream = new EventSource(`/api/stream?visible=${watching() ? 1 : 0}`);
    stream.addEventListener('hello', (e) => {
      const hello = JSON.parse(e.data);
      Object.assign(state, { viewer: hello.viewer, waitSeconds: hello.waitSeconds, connected: true });
      presence();
      renderConnection();
    });
    stream.addEventListener('sessions', (e) => { state.sessions = JSON.parse(e.data); renderSessions(); renderCounts(); if (panel.id) renderPanelHead(); });
    stream.addEventListener('pending', (e) => { state.pending = JSON.parse(e.data); renderPrompts(); renderCounts(); });
    stream.addEventListener('event', (e) => {
      const event = JSON.parse(e.data);
      if (!state.events.some((x) => x.id === event.id)) state.events.unshift(event);
      state.events.length = Math.min(state.events.length, 80);
      renderEvents();
      if (panel.id && (event.actor.id === panel.id || event.actor.parent === panel.id)) refreshStorySoon();
    });
    // EventSource reconnects by itself; the hub sends a fresh hello when it does.
    stream.onerror = () => { Object.assign(state, { connected: false, viewer: null }); renderConnection(); };
  }

  async function loadHistory() {
    try {
      const history = await (await fetch('/api/events?limit=40')).json();
      const seen = new Set(state.events.map((e) => e.id));
      state.events = [...state.events, ...history.filter((e) => !seen.has(e.id))].slice(0, 80);
      renderEvents();
    } catch { /* the live stream fills it in */ }
  }

  // -- rendering --
  function renderConnection() {
    const el = $('conn');
    el.dataset.state = state.connected ? 'up' : 'down';
    el.textContent = state.connected ? 'Live' : 'Hub not reachable, retrying…';
  }

  function renderCounts() {
    const counts = { working: 0, 'needs-me': 0, 'my-turn': 0, failed: 0 };
    for (const s of state.sessions) if (s.status in counts) counts[s.status] += 1;
    for (const [status, n] of Object.entries(counts)) $(`n-${status}`).textContent = n;
    const needs = Math.max(counts['needs-me'], state.pending.length);
    $('chip-needs').classList.toggle('on', needs > 0);
    document.title = needs ? `(${needs}) Mira` : 'Mira';
  }

  function renderPrompts() {
    const el = $('prompts');
    el.hidden = state.pending.length === 0;
    el.innerHTML = state.pending.length ? `<h2 class="eyebrow">Waiting for you</h2>${state.pending.map(promptHTML).join('')}<p class="hint">If you don't answer in time, the normal prompt appears in the terminal.</p>` : '';
    tick();
  }

  function promptHTML(p) {
    const session = state.sessions.find((s) => s.id === p.sessionId);
    const off = state.busy.has(p.id) ? ' disabled' : '';
    return `<article class="prompt box" data-prompt="${esc(p.id)}">
      <div class="prompt-head"><span class="pill" data-status="needs-me">Needs you</span><span class="where">${esc(p.system)}</span><span class="countdown" data-asked="${esc(p.askedAt)}"></span></div>
      <p class="prompt-title">${esc(session ? label(session) : short(p.sessionId))} wants to use <b>${esc(p.tool || 'a tool')}</b></p>
      ${p.summary ? `<pre class="cmd">${esc(p.summary)}</pre>` : ''}
      <div class="actions">
        <button type="button" class="go" data-answer="allow"${off}>Allow</button>
        <button type="button" class="stop" data-answer="deny"${off}>Deny</button>
        <button type="button" class="ghost" data-answer="terminal"${off}>Answer in terminal</button>
      </div>
      <div class="bar"><i></i></div>
    </article>`;
  }

  function renderSessions() {
    const groups = new Map();
    for (const s of state.sessions) groups.set(s.system, [...(groups.get(s.system) ?? []), s]);
    const sections = [...groups].map(([system, list]) => ({ system, list: list.sort((a, b) => rank(a) - rank(b) || b.lastAt.localeCompare(a.lastAt)) }))
      .sort((a, b) => rank(a.list[0]) - rank(b.list[0]) || a.system.localeCompare(b.system));
    const html = sections.length ? sections.map(sectionHTML).join('') : `<section class="project box empty"><h2>No sessions yet</h2>
      <p>Start a Claude Code session in any repo and it appears here, in a section named after the repo's folder.</p></section>`;
    if (html === lastSessionsHTML) return;
    $('sections').innerHTML = html;
    lastSessionsHTML = html;
    tick();
  }

  function sectionHTML({ system, list }) {
    const needs = list.filter((s) => s.status === 'needs-me').length;
    const active = list.filter((s) => s.status && s.status !== 'ended').length;
    const spent = list.reduce((sum, s) => sum + (s.usage?.costUsd ?? 0), 0);
    const spend = spent ? ` · <span title="Estimated cost of these sessions' finished turns">${cost(spent)}</span>` : '';
    return `<section class="project box">
      <header><h2>${esc(system)}</h2><span class="summary">${active} active${spend}${needs ? ` · <span class="needs">${needs} need${needs === 1 ? 's' : ''} you</span>` : ''}</span></header>
      ${list.map(sessionHTML).join('')}
    </section>`;
  }

  function sessionHTML(s) {
    const status = s.status || 'unknown';
    const helpers = s.subagents.filter((a) => a.status === 'working');
    const mode = s.permissionMode && s.permissionMode !== 'default' ? `<span class="mode" data-mode="${esc(s.permissionMode)}">${esc(s.permissionMode)}</span>` : '';
    const tree = s.worktree ? `<span class="mode tree" title="A git worktree of ${esc(s.system)}">worktree ${esc(s.worktree)}</span>` : '';
    const meta = [
      s.cwd ? `<span title="${esc(s.cwd)}">${esc(folder(s.cwd))}</span>` : '',
      s.lastTool ? `last ${esc(s.lastTool)}` : '',
      `<span data-since="${esc(s.lastAt)}"></span>`,
      s.usage ? `<span title="Estimated cost of finished turns · ${esc(tokens(s.usage.tokens))} tokens">${esc(cost(s.usage.costUsd))}</span>` : '',
      s.seenIn === 'transcript' ? '<span class="faint">found at startup</span>' : '',
    ].filter(Boolean).join(' · ');
    return `<div class="session${panel.id === s.id ? ' open' : ''}" data-status="${esc(status)}">
      <span class="pill" data-status="${esc(status)}">${LABEL[s.status] ?? 'Unknown'}</span>
      <div>
        <div class="title"><button type="button" class="title-btn" data-open="${esc(s.id)}" title="Open this session's story">${esc(label(s))}</button>${tree}${mode}</div>
        <div class="meta">${meta}</div>
        ${helpers.length ? `<div class="helpers">${helpers.map((a) => `<span class="helper">${esc(a.name || 'subagent')}</span>`).join('')}</div>` : ''}
      </div>
      ${s.cwd ? `<button type="button" class="ghost small" data-resume="${esc(s.id)}" title="Copy a command that resumes this session">Copy resume</button>` : ''}
    </div>`;
  }

  function renderEvents() {
    $('events').innerHTML = state.events.slice(0, 60).map((e) => {
      const who = e.actor.kind === 'subagent' ? `${e.system} › ${e.actor.name || 'subagent'}` : e.system;
      const what = e.detail?.tool ?? e.detail?.notification ?? e.detail?.reason ?? e.detail?.decision ?? '';
      return `<li><span class="t">${esc(clock(e.at))}</span><span class="line">${esc(who)} <span class="type">${esc(e.type)}</span> <span class="what">${esc(what)}</span></span></li>`;
    }).join('') || '<li class="faint">Events appear here as they happen.</li>';
  }

  // Relative times and countdowns update every second without re-rendering.
  function tick() {
    for (const el of document.querySelectorAll('[data-since]')) el.textContent = ago(el.dataset.since);
    for (const el of document.querySelectorAll('[data-asked]')) {
      const left = Math.max(0, state.waitSeconds - (Date.now() - Date.parse(el.dataset.asked)) / 1000);
      el.textContent = `${Math.ceil(left)}s left`;
      const bar = el.closest('.prompt')?.querySelector('.bar i');
      if (bar) bar.style.width = `${(left / state.waitSeconds) * 100}%`;
    }
  }

  // -- the story panel --
  function openSession(id) {
    if (panel.id !== id) {
      Object.assign(panel, { helper: null, helperName: '', turns: TURNS_STEP, story: null, error: '', open: new Set(), auto: null, editor: null });
      loadEditor(id);
    }
    panel.id = id;
    $('panel').hidden = false;
    try { history.replaceState(null, '', `#session=${encodeURIComponent(id)}`); } catch { /* not remembered */ }
    renderSessions();
    renderPanelHead();
    loadStory('first');
  }

  function openHelper(id, name) {
    Object.assign(panel, { helper: id, helperName: name, turns: TURNS_STEP, story: null, error: '', open: new Set(), auto: null });
    renderPanelHead();
    loadStory('first');
  }

  function closePanel() {
    clearTimeout(panel.timer);
    Object.assign(panel, { id: null, helper: null, story: null, timer: 0 });
    $('panel').hidden = true;
    try { history.replaceState(null, '', location.pathname); } catch { /* fine */ }
    renderSessions();
  }

  async function loadStory(mode) {
    const id = panel.id;
    const helper = panel.helper;
    if (!id) return;
    const params = new URLSearchParams({ turns: String(panel.turns) });
    if (helper) params.set('helper', helper);
    try {
      const res = await fetch(`/api/sessions/${encodeURIComponent(id)}/story?${params}`);
      if (panel.id !== id || panel.helper !== helper) return;
      if (res.ok) Object.assign(panel, { story: await res.json(), error: '' });
      else Object.assign(panel, { story: null, error: res.status === 404 ? "This session's transcript can't be read here." : `The hub couldn't read it (${res.status}).` });
    } catch {
      if (panel.id === id) panel.error = "The hub isn't reachable.";
    }
    renderPanelBody(mode);
  }

  // Which VS Code window holds the session, so the button can bring it forward.
  async function loadEditor(id) {
    try {
      const res = await fetch(`/api/sessions/${encodeURIComponent(id)}/editor`);
      if (res.ok && panel.id === id) panel.editor = await res.json();
    } catch { /* no button */ }
    if (panel.id === id) renderPanelHead();
  }

  // The link itself brings the right window forward, since a click may hand VS Code the focus;
  // the hub then opens the conversation, which VS Code gives to the window now in front.
  function continueInEditor() {
    const id = panel.id;
    if (!id || !panel.editor) return;
    fetch(`/api/sessions/${encodeURIComponent(id)}/editor`, { method: 'POST' })
      .then((res) => { if (!res.ok) toast(`The hub couldn't open it (${res.status}).`); })
      .catch(() => toast("The hub isn't reachable."));
    toast(`Opening the conversation in VS Code, in ${panel.editor.name}…`);
  }

  // At most one refresh every couple of seconds while the session is busy.
  function refreshStorySoon() {
    if (panel.timer) return;
    panel.timer = setTimeout(() => { panel.timer = 0; loadStory('live'); }, 2000);
  }

  function renderPanelHead() {
    const session = state.sessions.find((s) => s.id === panel.id);
    const name = session ? label(session) : short(panel.id);
    $('panel-title').textContent = panel.helper ? panel.helperName || 'Subagent' : name;
    $('panel-sub').textContent = panel.helper ? `Subagent of ${name}` : session ? [...new Set([session.system, folder(session.cwd)])].concat(LABEL[session.status] ?? []).filter(Boolean).join(' · ') : '';
    $('panel-back').hidden = !panel.helper;
    const editor = $('panel-editor');
    editor.hidden = !panel.editor;
    if (panel.editor) {
      editor.href = panel.editor.link;
      editor.title = `Opens this conversation in Claude Code, in the VS Code window for ${panel.editor.name}`;
    }
  }

  function renderPanelBody(mode) {
    const box = $('panel-turns');
    const fromBottom = box.scrollHeight - box.scrollTop - box.clientHeight;
    const top = box.scrollTop;
    const story = panel.story;
    if (!story) {
      $('panel-totals').innerHTML = '';
      box.innerHTML = `<p class="panel-msg">${esc(panel.error || 'Reading the transcript…')}</p>`;
      return;
    }
    const last = story.turns.at(-1);
    if (last && panel.auto !== last.id) {
      panel.open.add(last.id); // the latest turn starts unfolded
      panel.auto = last.id;
    }
    $('panel-totals').innerHTML = totalsHTML(story);
    const earlier = story.earlier ? `<button type="button" class="ghost small earlier" data-earlier>Show ${plural(Math.min(TURNS_STEP, story.earlier), 'earlier turn')} (${story.earlier} in all)</button>` : '';
    box.innerHTML = earlier + (story.turns.map(turnHTML).join('') || '<p class="panel-msg">Nothing has happened in this session yet.</p>');
    if (mode === 'first' || (mode === 'live' && fromBottom < 48)) box.scrollTop = box.scrollHeight;
    else if (mode === 'earlier') box.scrollTop = box.scrollHeight - box.clientHeight - fromBottom;
    else box.scrollTop = top;
  }

  function totalsHTML(story) {
    const u = story.usage;
    const items = [
      ['cost', 'Estimated cost', cost(u.costUsd)],
      ['', 'Output', tokens(u.output)],
      ['', 'Input', tokens(u.input)],
      ['', 'Cache reads', tokens(u.cacheRead)],
      ['', 'Cache writes', tokens(u.cacheWrite)],
      story.contextTokens != null ? ['', 'In context now', tokens(story.contextTokens)] : null,
      story.model ? ['', 'Model', story.model] : null,
    ].filter(Boolean);
    const unpriced = u.unpriced?.length ? `<p class="hint">The cost leaves out ${esc(u.unpriced.join(', '))}, which ${u.unpriced.length === 1 ? 'has' : 'have'} no price set.</p>` : '';
    return items.map(([cls, name, value]) => `<div class="${cls}">${esc(name)}<b>${esc(value)}</b></div>`).join('') + unpriced;
  }

  function turnHTML(t) {
    const open = panel.open.has(t.id);
    const tools = t.steps.filter((s) => s.kind === 'tool').length;
    const meta = [tools ? plural(tools, 'tool') : '', t.usage.costUsd ? cost(t.usage.costUsd) : ''].filter(Boolean).join(' · ');
    const shown = t.state === 'running' && quiet(t.endedAt) ? 'quiet' : t.state;
    const badge = STATE[shown] ? `<span class="state" data-state="${esc(shown)}" title="${shown === 'quiet' ? `Nothing since ${esc(when(t.endedAt))}` : ''}">${STATE[shown]}</span>` : '';
    const first = (t.prompt || 'Carried on by itself').split('\n').find((line) => line.trim()) || '…';
    return `<article class="turn" data-from="${esc(t.from)}">
      <button type="button" class="turn-head" data-turn="${esc(t.id)}" aria-expanded="${open}">
        <span class="t">${esc(when(t.at))}</span><span class="turn-prompt">${esc(first)}</span><span class="turn-meta">${badge}${esc(meta)}</span>
      </button>
      ${open ? `<div class="turn-body">${t.prompt ? `<p class="you">${esc(t.prompt)}</p>` : ''}${t.steps.map(stepHTML).join('')}</div>` : ''}
    </article>`;
  }

  function stepHTML(s) {
    if (s.kind === 'text') return typeof renderMarkdown === 'function' ? `<div class="reply md">${renderMarkdown(s.text)}</div>` : `<p class="reply">${esc(s.text)}</p>`;
    if (s.kind === 'note') return `<p class="note">${esc(s.text)}</p>`;
    const line = `<div class="tool${s.failed ? ' failed' : ''}"><span class="tool-name">${esc(s.name)}</span>${s.summary ? `<span class="tool-sum" title="${esc(s.summary)}">${esc(s.summary)}</span>` : ''}${s.failed ? '<span class="failed-tag">failed</span>' : ''}</div>`;
    const h = s.helper;
    if (!h) return line;
    return `${line}<div class="helper-card"><span class="helper">${esc(h.name || 'subagent')}</span><span>${plural(h.tools, 'tool')}</span><span>${esc(cost(h.usage.costUsd))}</span><span>${h.state === 'done' ? 'done' : quiet(h.lastAt) ? `quiet since ${esc(when(h.lastAt))}` : 'working'}</span>
      <button type="button" class="ghost small" data-helper="${esc(h.id)}" data-helper-name="${esc([h.name, h.description].filter(Boolean).join(': '))}">Open</button></div>`;
  }

  // -- actions --
  async function answer(id, decision) {
    state.busy.add(id);
    renderPrompts();
    try {
      const res = await fetch(`/api/prompts/${encodeURIComponent(id)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ decision }) });
      if (res.status === 404) toast('That prompt is no longer waiting. It was answered or timed out, so check the terminal.');
      else if (!res.ok) toast(`The hub couldn't take that answer (${res.status}).`);
    } catch {
      toast("The hub isn't reachable, so answer in the terminal.");
    } finally {
      state.busy.delete(id);
      renderPrompts();
    }
  }

  async function copyResume(button) {
    const session = state.sessions.find((s) => s.id === button.dataset.resume);
    if (!session) return;
    const command = `cd "${session.cwd}" && claude --resume ${session.id}`;
    try {
      await navigator.clipboard.writeText(command);
      toast(`Copied: ${command}`);
    } catch {
      toast(command);
    }
  }

  document.addEventListener('click', (e) => {
    const answerButton = e.target.closest('[data-answer]');
    if (answerButton) return void answer(answerButton.closest('[data-prompt]').dataset.prompt, answerButton.dataset.answer);
    const resumeButton = e.target.closest('[data-resume]');
    if (resumeButton) return void copyResume(resumeButton);
    const openButton = e.target.closest('[data-open]');
    if (openButton) return openSession(openButton.dataset.open);
    const turnButton = e.target.closest('[data-turn]');
    if (turnButton) {
      const id = turnButton.dataset.turn;
      if (!panel.open.delete(id)) panel.open.add(id);
      return renderPanelBody('keep');
    }
    if (e.target.closest('[data-earlier]')) {
      panel.turns += TURNS_STEP;
      return void loadStory('earlier');
    }
    const helperButton = e.target.closest('[data-helper]');
    if (helperButton) return openHelper(helperButton.dataset.helper, helperButton.dataset.helperName);
  });
  $('panel-close').addEventListener('click', closePanel);
  $('panel-editor').addEventListener('click', continueInEditor);
  $('panel-back').addEventListener('click', () => {
    Object.assign(panel, { helper: null, helperName: '', turns: TURNS_STEP, story: null, open: new Set(), auto: null });
    renderPanelHead();
    loadStory('first');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && panel.id) closePanel();
  });
  $('hold').addEventListener('change', (e) => {
    hold = e.target.checked;
    try { localStorage.setItem('mira.answerHere', hold ? 'on' : 'off'); } catch { /* not remembered */ }
    presence();
  });
  document.addEventListener('visibilitychange', presence);

  renderSessions();
  renderEvents();
  connect();
  loadHistory();
  setInterval(tick, 1000);
  const linked = location.hash.match(/^#session=([\w-]+)$/);
  if (linked) openSession(linked[1]);
})();
</script>
</body>
</html>
